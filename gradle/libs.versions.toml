[versions]
agp = "9.4.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
material = "1.14.0"
activityKtx = "1.13.0"
activity = "1.9.3"
constraintlayout = "2.2.2"

# ¿Para qué sirve?: centralizar las versiones de las librerías que el proyecto usa.
# ¿Qué hace?: define strings de versión que luego se referencian desde [libraries]
#             para no repetir números en múltiples archivos.
# ¿Cuál es su función en el código?: fuente única de verdad para versiones de dependencias.
navigation = "2.8.0"
biometric = "1.1.0"
fragment = "1.8.2"
recyclerview = "1.3.2"

[libraries]
# ¿Para qué sirve?: declarar cada librería una sola vez con nombre lógico y versión.
# ¿Qué hace?: asocia un alias (por ejemplo androidx-navigation-fragment) al
#             group:artifact:version real que descargará Gradle.
# ¿Cuál es su función en el código?: permite usar libs.androidx.navigation.fragment
#             en build.gradle.kts en lugar de escribir la coordenada completa.
androidx-navigation-fragment = { module = "androidx.navigation:navigation-fragment", version.ref = "navigation" }
androidx-navigation-ui = { module = "androidx.navigation:navigation-ui", version.ref = "navigation" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
activity = { module = "androidx.activity:activity", version.ref = "activity" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }

